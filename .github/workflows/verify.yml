name: Verify PoC

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate repository JSON contracts
        run: python validate_artifacts.py

      - name: Check regenerated artifacts are current
        run: python regenerate_frozen_artifacts.py --check

      - name: Run verifier
        run: python verify_poc.py

      - name: Run unit tests
        run: python -m unittest -q
